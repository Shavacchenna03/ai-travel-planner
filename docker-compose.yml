services:
  postgres:
    image: postgres:16-alpine
    container_name: roamly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roamly
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: roamly_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
